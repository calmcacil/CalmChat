name: CI

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch:

permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    changes:
        name: changes
        permissions:
            contents: read
            pull-requests: read
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            should_run: ${{ steps.filter.outputs.code_or_release }}

        steps:
          - name: Clone project
            uses: actions/checkout@v4
            with:
                fetch-depth: 0

          - name: Detect code and release file changes
            id: filter
            uses: dorny/paths-filter@v3
            with:
                filters: |
                    code_or_release:
                      - '**/*.lua'
                      - '**/*.toc'
                      - 'scripts/**'
                      - 'VERSION'
                      - '.release-please-manifest.json'
                      - 'release-please-config.json'

    static:
        name: static
        needs: changes
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.should_run == 'true'
        permissions:
            contents: read
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
          - name: Clone project
            uses: actions/checkout@v4

          - name: Install Lua 5.1
            run: |
                sudo apt-get update
                sudo apt-get install -y --no-install-recommends lua5.1

          - name: Run static checks
            run: bash scripts/check-static.sh

    package:
        name: package
        needs:
            - changes
            - static
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.should_run == 'true'
        permissions:
            contents: read
        runs-on: ubuntu-latest
        timeout-minutes: 10
        env:
            GITHUB_OAUTH: ${{ github.token }}

        steps:
          - name: Clone project
            uses: actions/checkout@v4
            with:
                fetch-depth: 0

          - name: Build dry-run package
            uses: BigWigsMods/packager@v2
            with:
                args: -d

          - name: Upload packaged artifact
            uses: actions/upload-artifact@v4
            with:
                name: calmchat-package-dry-run
                path: |
                    .release/*.zip
                    .release/**/*.zip
                if-no-files-found: warn
                include-hidden-files: true
